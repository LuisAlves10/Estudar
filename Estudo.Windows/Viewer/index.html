<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Leitor de provas</title><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;background:#dfe5e1;color:#20372c}header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 12px;background:#f5f8f6;border-bottom:1px solid #c9d4ce}button,input,select{font:inherit;border:1px solid #bccbc2;border-radius:5px;background:#fff;color:#20372c;padding:5px 8px;min-height:32px}button{cursor:pointer}button:hover{border-color:#126c54}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #996016}input{width:52px}#status{font-size:12px;margin-left:auto}#scroll{height:calc(100vh - 50px);overflow:auto;padding:18px;overscroll-behavior:contain}#paper{position:relative;margin:auto;background:white;box-shadow:0 1px 6px #0002}canvas{display:block}.textLayer{position:absolute;inset:0;overflow:clip;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0}.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}.textLayer span::selection{background:#1c926a55}.textLayer span.markedContent{top:0;height:0}#message{text-align:center;padding:80px 20px;line-height:1.8}body.dark{background:#18231e}body.dark header{background:#24372c;color:#e4f1e9;border-color:#455f50}body.dark button,body.dark input,body.dark select{background:#2e4336;color:#e4f1e9;border-color:#557260}
</style></head><body><header><button id="prev" aria-label="Página anterior">‹</button><label>Página <input id="page" type="number" min="1" value="1" aria-label="Página do PDF"></label><span id="total">/ —</span><button id="next" aria-label="Próxima página">›</button><button id="minus" aria-label="Reduzir zoom">−</button><select id="zoom" aria-label="Zoom"><option value="fit">Largura</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="plus" aria-label="Aumentar zoom">+</button><span id="status">PDF oficial · página inteira</span></header><div id="scroll"><div id="message">Selecione uma prova para ler.</div><div id="paper"><canvas></canvas><div class="textLayer"></div></div></div><script type="module" src="viewer.mjs"></script></body></html>
