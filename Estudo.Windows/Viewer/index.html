<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Leitor de provas</title><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;background:#dfe5e1;color:#20372c;height:100vh;display:flex;flex-direction:column}header{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:7px 10px;background:#f5f8f6;border-bottom:1px solid #c9d4ce;flex:none}button,input,select{font:inherit;border:1px solid #bccbc2;border-radius:5px;background:#fff;color:#20372c;padding:5px 8px;min-height:32px}button{cursor:pointer}button:hover{border-color:#126c54}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #996016}input{width:48px}#status{font-size:12px;padding:5px 12px;background:#f5f8f6;flex:none}#scroll{flex:1;min-height:0;overflow:auto;padding:18px;overscroll-behavior:contain}.page-card{width:max-content;margin:0 auto 18px}.paper{position:relative;background:#fff;box-shadow:0 1px 6px #0002}canvas{display:block}.caption{display:block;width:100%;margin-bottom:6px;text-align:left;font-size:12px}.selection-layer{position:absolute;inset:0;cursor:crosshair;touch-action:none}.selection{display:none;position:absolute;border:2px solid #126c54;background:#126c5422;pointer-events:none}.textLayer{position:absolute;inset:0;overflow:clip;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0}.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}.textLayer span::selection{background:#1c926a55}.textLayer span.markedContent{top:0;height:0}#message{text-align:center;padding:60px 20px}body.dark{background:#18231e}body.dark header,body.dark #status{background:#24372c;color:#e4f1e9;border-color:#455f50}body.dark button,body.dark input,body.dark select{background:#2e4336;color:#e4f1e9;border-color:#557260}[hidden]{display:none!important}
details{background:#f5f8f6;padding:4px 10px;font-size:12px;flex:none}summary{cursor:pointer;padding:3px}.region-actions,#edit-actions{display:flex;gap:6px;flex-wrap:wrap;padding:5px 10px}body.dark details{background:#24372c}#edit-actions{background:#e5f1e9}@media(max-width:520px){.page-label,.long-label{display:none}header{gap:4px;padding:5px 7px}button,input,select{font-size:12px;min-height:28px;padding:4px 6px}#status{font-size:11px;padding:4px 8px}#scroll{padding:10px}input{width:40px}}
</style></head><body>
<header><button id="prev" aria-label="Página anterior">‹</button><label><span class="page-label">Página </span><input id="page" type="number" min="1" value="1" aria-label="Página do PDF"></label><span id="total">/ —</span><button id="next" aria-label="Próxima página">›</button><button id="minus" aria-label="Reduzir zoom">−</button><button id="plus" aria-label="Aumentar zoom">+</button><button id="full" title="Página inteira">Página<span class="long-label"> inteira</span></button><button id="question" title="Ver os recortes da questão" disabled>Questão</button></header>
<details id="region-tools"><summary>Zoom e recortes</summary><div class="region-actions"><select id="zoom" aria-label="Zoom"><option value="fit">Ajustar largura</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="add" disabled>Definir recorte</button><select id="region" aria-label="Recorte da questão" hidden></select><button id="replace" disabled>Corrigir</button><button id="remove" disabled>Excluir</button></div></details><div id="edit-actions" hidden><button id="save" disabled>Salvar recorte</button><button id="cancel">Cancelar</button></div>
<div id="status" role="status">PDF oficial · página inteira</div><div id="scroll"><div id="message">Selecione uma prova para ler.</div><div id="pages"></div></div><script type="module" src="viewer.mjs"></script></body></html>
